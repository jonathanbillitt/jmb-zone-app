<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="p" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c53cff"/>
      <stop offset="1" stop-color="#6a2cf5"/>
    </linearGradient>
    <linearGradient id="c" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5fd7ff"/>
      <stop offset="1" stop-color="#1f8fe0"/>
    </linearGradient>
    <radialGradient id="bg" cx="0.5" cy="0.35" r="0.95">
      <stop offset="0" stop-color="#141430"/>
      <stop offset="1" stop-color="#08081a"/>
    </radialGradient>
  </defs>
  <!-- Full-bleed background: the launcher mask supplies the rounding, so no
       corner radius here or the mask would reveal dark gaps. -->
  <rect width="128" height="128" fill="url(#bg)"/>
  <!-- No frame box: the launcher circle-mask clipped its corners oddly. Just the
       JMB logo (bars + wordmark), kept inside the maskable safe zone. -->
  <rect x="30" y="38" width="68" height="12" rx="3" fill="url(#p)"/>
  <rect x="30" y="78" width="68" height="12" rx="3" fill="url(#p)"/>
  <text x="64" y="76" font-family="system-ui,'Segoe UI',Roboto,sans-serif"
        font-size="30" font-weight="800" letter-spacing="1"
        fill="url(#c)" text-anchor="middle">JMB</text>
</svg>
