<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="p" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c53cff"/>
      <stop offset="1" stop-color="#6a2cf5"/>
    </linearGradient>
    <linearGradient id="c" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5fd7ff"/>
      <stop offset="1" stop-color="#1f8fe0"/>
    </linearGradient>
    <radialGradient id="bg" cx="0.5" cy="0.35" r="0.9">
      <stop offset="0" stop-color="#141430"/>
      <stop offset="1" stop-color="#08081a"/>
    </radialGradient>
  </defs>
  <!-- Full-bleed: the OS applies its own corner mask, so baking a radius here
       (and leaving transparent corners) is what showed edges on the home screen. -->
  <rect width="128" height="128" fill="url(#bg)"/>
  <!-- Logo scaled up to fill the tile — JMB kept within the mask's safe circle
       so the letters never clip when the launcher rounds the icon. -->
  <rect x="18" y="22" width="92" height="14" rx="4" fill="url(#p)"/>
  <rect x="18" y="92" width="92" height="14" rx="4" fill="url(#p)"/>
  <text x="64" y="80" font-family="system-ui,'Segoe UI',Roboto,sans-serif"
        font-size="46" font-weight="800" letter-spacing="1"
        fill="url(#c)" text-anchor="middle">JMB</text>
</svg>
